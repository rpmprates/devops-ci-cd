<!DOCTYPE html>
<html>
<head>
    <title>Consulta de Conta</title>
</head>

<body>

<h2>Consultar Saldo</h2>

<input id="conta" placeholder="Digite a conta">
<button onclick="consultarSaldo()">Consultar</button>

<h3 id="resultado"></h3>

<script>

async function consultarSaldo(){

    const conta = document.getElementById("conta").value;

    const response = await fetch("http://localhost:8080/contas/" + conta + "/saldo");

    const data = await response.json();

    document.getElementById("resultado").innerText =
        "Saldo: " + data.saldo;

}

</script>

</body>
</html>
