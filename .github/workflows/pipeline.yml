```yaml
name: pipeline

on:
  push:
    branches:
      - develop
      - release
      - main
  workflow_dispatch:

jobs:

  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Run tests
        run: mvn test

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  build:
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/*.jar

  frontend-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build app
        run: mvn -B clean package -DskipTests

      - name: Start Spring Boot
        run: |
          nohup java -jar target/*.jar &
          sleep 25

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
          npx playwright install --with-deps

      - name: Run frontend tests
        run: |
          cd frontend
          npm test

  code-analysis:
    runs-on: ubuntu-latest
    needs: frontend-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  smoke-test-stg:
    runs-on: ubuntu-latest
    needs: code-analysis
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test
        run: sh src/main/scripts/smoketest.sh

  integration-test:
    runs-on: ubuntu-latest
    needs: smoke-test-stg
    if: github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests
        run: sh src/main/scripts/testeIntegrado.sh

  functional-test:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/release'

    steps:
      - uses: actions/checkout@v4

      - name: Run functional tests
        run: sh src/main/scripts/testesFuncionais.sh

  performance-test-release:
    runs-on: ubuntu-latest
    needs: functional-test
    if: github.ref == 'refs/heads/release'

    steps:
      - uses: actions/checkout@v4

      - name: Run performance tests
        run: sh src/main/scripts/testesPerformance.sh

  smoke-test-prod:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test prod
        run: sh src/main/scripts/smoketest.sh

  performance-test-prod:
    runs-on: ubuntu-latest
    needs: smoke-test-prod
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Run performance tests prod
        run: sh src/main/scripts/testesPerformance.sh
```
